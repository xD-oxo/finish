<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>發現我了</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #1d1d1d, #000000);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      overflow-y: auto; /* 必改：允許垂直滾動 */
      overflow-x: hidden;
      flex-direction: column;
      justify-content: center;
    }

    /* 霓虹背景特效 */
    .neon-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #00f5ff, #a000ff);
      filter: blur(150px);
      opacity: 0.2;
      animation: moveBG 10s ease-in-out infinite alternate;
      z-index: 0;
      position: fixed; /* 背景固定 */
    }

    @keyframes moveBG {
      from { transform: translate(-10%, -10%); }
      to { transform: translate(10%, 10%); }
    }

    /* 導覽列 */
    nav {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 30px;
      z-index: 2;
      position: relative;
      flex-wrap: wrap; /* 必改 */
    }

    nav a {
      text-decoration: none;
      color: #00f5ff;
      text-shadow: 0 0 10px #00f5ff;
      font-size: 1.2em;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ff00ff;
      text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
    }

    /* 主內容區 */
    .interests-section {
      position: relative;
      z-index: 2;
      padding: 80px 10%;
      text-align: center;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8em;
      color: #00f5ff;
      text-shadow: 0 0 20px #00f5ff;
      margin-bottom: 60px;
    }

    .interest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 40px;
      justify-items: center;
    }

    .interest-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(228, 132, 255, 0.3);
      border-radius: 20px;
      padding: 20px;
      width: 220px;
      text-align: center;
      transition: 0.4s;
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.1);
      box-sizing: border-box; /* 確保 padding 不撐大盒子 */
    }

    .interest-item:hover {
      transform: translateY(-10px);
      border-color: #ff00ff;
      box-shadow: 0 0 25px #ff00ff, 0 0 50px #00f5ff;
    }

    .interest-icon {
      font-size: 3em;
      margin-bottom: 15px;
      color: #00f5ff;
      text-shadow: 0 0 20px #00f5ff;
      transition: 0.3s;
    }

    .interest-item:hover .interest-icon {
      color: #ff00ff;
      text-shadow: 0 0 30px #ff00ff;
    }

    .interest-title {
      font-weight: 600;
      font-size: 1.3em;
      margin-bottom: 10px;
    }

    .interest-desc {
      font-size: 0.95em;
      color: #ccc;
      line-height: 1.6em;
    }

    footer {
      text-align: center;
      padding: 40px 0;
      color: #999;
      font-size: 0.9em;
      text-shadow: 0 0 5px #00f5ff;
      z-index: 2;
      position: relative;
    }

    /* RWD 手機版調整 */
    @media (max-width: 768px) {
      .interests-section { padding: 40px 5%; }
      h1 { font-size: 2.2em; margin-bottom: 30px; }
      nav { gap: 15px; padding: 20px; }
      .interest-grid { gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="neon-bg"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="interests.html" style="color:#ff00ff;text-shadow:0 0 20px #ff00ff;">Interests</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="interests-section">
    <h1>我的興趣</h1>

    <div class="interest-grid">
      <div class="interest-item">
        <div class="interest-icon">🎞️</div>
        <div class="interest-title">後製剪輯</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">📸</div>
        <div class="interest-title">攝影錄影</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">🔨</div>
        <div class="interest-title">3D建模</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">🎮</div>
        <div class="interest-title">遊戲設計</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">🎛️</div>
        <div class="interest-title">音樂製作</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">⌨️</div>
        <div class="interest-title">程式設計</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">🖥️</div>
        <div class="interest-title">電腦遊戲</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">🏃‍➡️</div>
        <div class="interest-title">外出冒險</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">🗨️</div>
        <div class="interest-title">思考寫作</div>
      </div>

      <div class="interest-item">
        <div class="interest-icon">🤯</div>
        <div class="interest-title">懷疑人生</div>
      </div>

    </div>
  </section>

  <footer>
    © 2025 Yi Huan Sun| 
  </footer>
</body>
</html>
